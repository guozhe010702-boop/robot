[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elite-ec-socket-sdk"
version = "0.1.0"
description = "Reusable EC/EA controller JSON-RPC 8055 Python client"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Proprietary project code"}

[tool.setuptools.packages.find]
include = ["elite_ec_sdk*"]
